<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ChillMate">
  <defs>
    <linearGradient id="c" x1="14" y1="10" x2="50" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C8CFF"/>
      <stop offset="1" stop-color="#4E6BF5"/>
    </linearGradient>
    <linearGradient id="k" x1="24" y1="40" x2="48" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6FE3B4"/>
      <stop offset="1" stop-color="#8CEBC4"/>
