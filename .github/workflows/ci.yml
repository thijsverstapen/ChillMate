name: CI

# The project had no CI at all: every build, test and consistency check across
# six targets and five languages was manual. This gate would have caught the
# build-setting drift fixed in 4.2.1 (a test target requiring a newer iOS than
# the app, a malformed bundle identifier, one target left on Swift 5).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SCHEME: ChillMate

jobs:
  # Cheap checks that need no Xcode, so a typo in the catalog or a stray build
  # artifact fails in seconds rather than after a full build.
  lint:
    name: Consistency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: String Catalogs are complete and well formed
        run: python3 scripts/check_localization.py

      - name: No build artifacts are tracked
        run: |
          if git ls-files | grep -qE '^(DerivedData|DerivedDataDevice|build)/'; then
            echo "::error::Build artifacts are tracked in git."
            git ls-files | grep -E '^(DerivedData|DerivedDataDevice|build)/' | head -20
            exit 1
          fi

      - name: No UserDefaults keys outside the registry
        run: python3 scripts/check_defaults_keys.py

  build-test:
    name: Build and test
    # Must ship Xcode 26 or newer. ChillMate.xcodeproj is saved in project format
    # 100, and an older Xcode cannot even open it: macos-15 failed in 20 seconds
    # with "the project cannot be opened because it is in a future Xcode project
    # file format (100)", before compiling a single file. `macos-latest` is not a
    # fix either, because GitHub keeps that label on the previous stable image for
    # a while after a new one ships.
    runs-on: macos-26
    # A cold build of six targets plus a UI run that retries once needs the room.
    # continue-on-error cannot rescue a job that hits its own timeout, so this has
    # to sit above the worst realistic case rather than the typical one.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        # Pinning an exact Xcode_26.app breaks whenever the runner image is
        # updated; take whatever the image has and print it for the log.
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Resolve a simulator destination
        run: |
          DEST=$(python3 scripts/pick_simulator.py)
          echo "DESTINATION=$DEST" >> "$GITHUB_ENV"
          echo "Using $DEST"

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      # Once per shipped language, not once overall.
      #
      # The suite used to assert English literals, so it only ever proved
      # anything about English, and this job could not reveal that because
      # GitHub's runners are en_US. On a Dutch simulator 21 of these failed while
      # the risk engine was behaving perfectly, and four more passed for the
      # worst reason: they asserted an English fragment was absent, which holds
      # trivially in every other language.
      #
      # The assertions are language-independent now, which is what makes running
      # them per language worth the minutes: each pass exercises the engine
      # against the catalog a user of that language actually reads, and
      # SafetyTranslationTests checks the served strings really came from that
      # language rather than falling back to English.
      #
      # One loop rather than a job matrix, because the build above is the
      # expensive part and this reuses it; the five test passes are seconds each.
      - name: Unit tests (all five languages)
        run: |
          set -o pipefail
          status=0
          for lang in en nl de fr es; do
            echo "::group::Unit tests ($lang)"
            xcodebuild test-without-building \
              -scheme "$SCHEME" \
              -destination "$DESTINATION" \
              -only-testing:ChillMateTests \
              -testLanguage "$lang" \
              -resultBundlePath "TestResults/UnitTests-$lang.xcresult" \
              CODE_SIGNING_ALLOWED=NO \
              | xcbeautify || status=1
            echo "::endgroup::"
          done
          exit $status

      # Advisory, not a gate. These four tests drive a real simulator through
      # first-run onboarding by tapping labelled controls, which on a shared
      # runner fails for reasons that have nothing to do with the change under
      # test: a slow boot, a simulator that never settles, a keyboard that comes
      # up late. Blocking every merge on that trains people to ignore CI, and the
      # unit tests above are the ones that assert on behaviour. A failure here
      # still shows on the run as a red step with the .xcresult attached.
      - name: UI smoke tests
        id: ui-smoke
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:ChillMateUITests/ChillMateUITests/testLaunchesToForeground \
            -only-testing:ChillMateUITests/ChillMateUITests/testLaunchesInEveryLanguage \
            -only-testing:ChillMateUITests/ChillMateUITests/testEachTabOpens \
            -only-testing:ChillMateUITests/ChillMateUITests/testLogSheetOpens \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults/UISmokeTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Upload test results
        # The path used to be a "~/Library/..." glob. upload-artifact resolves its
        # path itself rather than through a shell, so the tilde was taken as a
        # directory name and nothing was ever collected. Writing the bundles into
        # the workspace removes the question.
        #
        # `failure()` alone would miss the UI step, whose continue-on-error keeps
        # the job green, so its own outcome is asked for separately.
        if: failure() || steps.ui-smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 5
          if-no-files-found: ignore
